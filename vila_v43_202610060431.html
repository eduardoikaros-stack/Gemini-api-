<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caça · Compilador de Blocos</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;background:#0a1220;color:#e6edf7}
button{font:inherit;cursor:pointer;border:0;color:inherit}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0a1220}
#vazio{position:fixed;inset:0;display:grid;place-items:center;color:#5d6f8c;font-size:13px;text-align:center;padding:20px;pointer-events:none;z-index:1}
#gear{position:fixed;top:14px;right:14px;width:48px;height:48px;border-radius:50%;z-index:50;font-size:22px;background:linear-gradient(135deg,#ffd166,#56e39f);color:#06111e;box-shadow:0 6px 22px rgba(0,0,0,.5);display:grid;place-items:center}
#gear.sujo::after{content:'';position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#ff7084;border:2px solid #0a1220}
#panel{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.72);justify-content:flex-end}
#panel.on{display:flex}
.pin{width:min(720px,100%);height:100%;background:#0f1a2e;border-left:1px solid #1f2a44;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #1f2a44}
.ph .t{flex:1;font-weight:800;font-size:15px}
.ph .x{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.08)}
.pb{flex:1;overflow-y:auto;padding:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.bar button{padding:10px 14px;border-radius:9px;font-weight:700;font-size:12.5px;background:#1c2940;border:1px solid #26344d}
.bar button.ok{background:#00a884;border-color:#00a884;color:#fff}
.bar button.clr{background:#6cb8ff;border-color:#6cb8ff;color:#06111e}
.bar button.tst{background:#ffd166;border-color:#ffd166;color:#06111e}
.bar button.exp{background:linear-gradient(135deg,#a98cff,#ff78dc);color:#fff;border-color:transparent}
.nota{font-size:11.5px;color:#8fa1bd;margin:2px 0 10px;line-height:1.5}
.mod{background:#0b1220;border:1px solid #1f2a44;border-radius:11px;padding:10px 12px;margin-bottom:8px}
.mod.off{opacity:.5}
.mod .l1{display:flex;gap:10px;align-items:center}
.tg{width:36px;height:20px;border-radius:10px;background:#26344d;position:relative;flex-shrink:0;cursor:pointer}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8fa1bd;transition:.2s}
.tg.on{background:#00a884}.tg.on::after{left:18px;background:#fff}
.meta{flex:1;min-width:0}
.id{font:700 11px monospace;color:#6cb8ff}
.nome{font-weight:700;font-size:13px;margin-top:2px}
.desc,.arq{font-size:11.5px;color:#8fa1bd;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.acts button{height:32px;padding:0 10px;border-radius:8px;border:1px solid #26344d;background:#1c2940;font-size:12px}
.acts button.del{color:#ff7084}
#msg{position:fixed;left:12px;right:12px;bottom:14px;z-index:95;padding:10px 14px;border-radius:10px;background:#0f3a2e;border:1px solid #00a884;font-size:12.5px;display:none;white-space:pre-wrap;max-height:40vh;overflow:auto}
#msg.on{display:block}#msg.ruim{background:#4a1520;border-color:#ff7084}
.ed{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:12px}
.ed .box{width:min(880px,100%);height:min(92vh,860px);background:#0f1a2e;border:1.5px solid #6cb8ff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ed h3{margin:0;font-size:13.5px;color:#6cb8ff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed h3 i{flex:1;min-width:20px}
.ed h3 button,.ed .bb button{padding:9px 12px;border-radius:8px;background:#1c2940;border:1px solid #26344d;font-weight:700;font-size:12px}
.ed h3 button.cb{background:#6cb8ff;border-color:#6cb8ff;color:#06111e}
.ed textarea{flex:1;background:#060c18;color:#e6edf7;border:1px solid #26344d;border-radius:8px;padding:10px;font:12px/1.5 monospace;resize:none;outline:none;min-height:200px}
.ed .bb{display:flex;gap:8px}.ed .bb button{flex:1;padding:12px}
.ed .bb .ok{background:#00a884;border-color:#00a884;color:#fff}
.tipo{font:700 10px system-ui;padding:3px 7px;border-radius:5px;background:#1c2940;color:#8fa1bd;letter-spacing:.5px}
.tipo.js{background:#4a2c1a;color:#ffb870}
.tipo.html{background:#1a3a2c;color:#7fdcae}
.tipo.json{background:#1a2c4a;color:#7faeff}
.tipo.vazio{background:#1c2940;color:#5d6f8c}
.contador{font:700 11px monospace;color:#6cb8ff;padding:4px 8px;background:#060c18;border-radius:6px;border:1px solid #26344d}
.contador.alto{color:#ffd166;border-color:#ffd166}
.contador.estouro{color:#ff7084;border-color:#ff7084}
.rel{flex:1;overflow:auto;background:#060c18;border:1px solid #26344d;border-radius:8px;padding:10px;font:12px/1.6 monospace;white-space:pre-wrap;color:#cfe0f7}.ed .bb.up button{padding:10px 4px;font-size:12px}
</style>
</head>
<body>
<iframe id="stage" sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-downloads allow-pointer-lock"></iframe>
<div id="vazio">Nenhum bloco ativo.<br>Toque em ⚙️ para adicionar.</div>
<button id="gear" aria-label="Abrir engrenagem">⚙️</button>

<div id="panel"><div class="pin">
  <div class="ph"><span class="t">⚙️ Blocos</span><button class="x" id="bX" aria-label="Fechar">✕</button></div>
  <div class="pb">
    <div class="bar">
      <button id="bPaste" class="clr">📋 Colar</button>
      <button id="bAdd">➕ Em branco</button>
      <button id="bFile">📂 Arquivo</button>
      <button id="bSave" class="ok">💾 Salvar HTML</button>
    </div>
    <div class="bar">
      <button id="bExp" class="exp">📤 Exportar JSON</button>
      <button id="bImp" class="tst">📥 Importar JSON</button>
      <button id="bRe">🔄 Recarregar tela</button>
      <button id="bUpd" class="ok">🔄 Atualizar sistema</button>
    </div>
    <div class="nota" id="nota"></div>
    <div id="lista"></div>
  </div>
</div></div>
<div id="msg"></div>

  var s={};SL.forEach(function(k){s[k]=(b.slots&&typeof b.slots[k]==='string')?b.slots[k]:''});
  var a=b.arquivo||{};
  return{id:String(b.id||'bloco'),nome:String(b.nome||b.id||'Sem nome'),desc:String(b.desc||''),

    arquivo:{nome:String(a.nome||''),caminho:String(a.caminho||''),tamanho:+a.tamanho||0,data:String(a.data||'')},slots:s};
}
function uid(id){var x=id,n=2;while(B.some(function(b){return b.id===x}))x=id+'_'+(n++);return x}
function ordena(){B.sort(function(a,b){return a.ordem-b.ordem})}

var PRE="(function(){function M(){var d={};return{getItem:function(k){return k in d?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}"
  +"try{Object.defineProperty(window,'localStorage',{value:M()});Object.defineProperty(window,'sessionStorage',{value:M()})}catch(e){}"
  +"try{Object.defineProperty(window,'indexedDB',{value:{open:function(){var r={};setTimeout(function(){r.error=new Error('teste');if(r.onerror)r.onerror({target:r})},0);return r}}})}catch(e){}"

function compilar(L,teste){
  var at=(L||B).filter(function(b){return b.ativo}),head='',css='',html='',js='';mapa=[];
  at.forEach(function(b){head+=b.slots.head+'\n';css+=b.slots.css+'\n';html+=b.slots.html+'\n'});

}

function rodar(){
  pend=false;
  var n=B.filter(function(b){return b.ativo}).length;
  $('vazio').style.display=n?'none':'grid';
  var ifr=$('stage');
  if(!n){ try{ifr.removeAttribute('src');}catch(e){} try{ifr.srcdoc='';}catch(e){} return; }
  var html=compilar();
  try{
    if(_blobUrl){try{URL.revokeObjectURL(_blobUrl);}catch(e){}_blobUrl=null;}
    _blobUrl=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    try{ifr.removeAttribute('src');}catch(e){}
    try{ifr.removeAttribute('srcdoc');}catch(e){}
    ifr.src=_blobUrl;
  }catch(e){
    try{ifr.removeAttribute('src');ifr.srcdoc=html;}catch(e2){msg('Falha: '+e2.message,true);}
  }
}

/* ============ SALVAR — só 1 arquivo HTML, URL-encoded ============ */
function salvar(){
  try{
    var json = JSON.stringify(B);
    var enc = encodeURIComponent(json);
    var novoScript = SO + ' id="blocos-dados" type="application/json" data-enc="uri">' + enc + SC;
    var rx = /<script\s+id="blocos-dados"[^>]*>[\s\S]*?<\/script>/i;
    if(!rx.test(RAW)) throw new Error('não achei <script id="blocos-dados"> no arquivo');
    var out = RAW.replace(rx, function(){ return novoScript; });
    var stamp = new Date().toISOString().slice(0,16).replace(/\D/g,'');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], {type:'text/html'}));
    a.download = 'caca_'+stamp+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
    sujo = false; marca();
    msg('✅ HTML salvo: '+kb(out.length)+' · '+B.length+' bloco(s) dentro.');
  }catch(e){ msg('NÃO salvou: '+e.message,true); }
}

function pegar(multi,cb){
  var i=document.createElement('input');i.type='file';i.accept='.html,.htm,.json';i.multiple=!!multi;
  i.onchange=function(){
    var fs=[].slice.call(i.files||[]),out=[],p=fs.length;if(!p)return;
    fs.forEach(function(f,k){var r=new FileReader();
      r.onload=function(){out[k]={nome:f.name,tamanho:f.size,data:new Date(f.lastModified).toISOString().slice(0,10),texto:String(r.result)};if(--p===0)cb(out.filter(Boolean))};
      r.onerror=function(){if(--p===0)cb(out.filter(Boolean))};r.readAsText(f)});
  };i.click();
}

/* ============ LER ARQUIVO — aceita html e json ============ */
function lerArquivo(f){
  var t = f.texto;
  // Tenta JSON puro primeiro
  if(/\.json$/i.test(f.nome) || t.trim().charAt(0)==='[' || t.trim().charAt(0)==='{'){
    try{
      var p = JSON.parse(t);
      var arr = Array.isArray(p) ? p : [p];
      return arr.map(function(b){var n=norm(b);if(!n.arquivo.nome){n.arquivo.nome=f.nome;n.arquivo.tamanho=f.tamanho;n.arquivo.data=f.data}return n;});
    }catch(e){}
  }
  // Tenta achar <script id="blocos-dados">
  var m = t.match(/<script[^>]*id=["']blocos-dados["'][^>]*>([\s\S]*?)<\/script>/i);
  if(m){
    var raw = m[1].trim();
    try{
      var c;
      if(raw.indexOf('%5B')===0 || raw.indexOf('%7B')===0) c = JSON.parse(decodeURIComponent(raw));
      else c = JSON.parse(raw);
      return (Array.isArray(c)?c:[c]).map(norm);
    }catch(e){ throw new Error('JSON dentro do HTML corrompido: '+e.message); }
  }
  // Tenta extrair como HTML normal
  return [htmlParaBloco(f)];
}

function htmlParaBloco(f){
  var d=new DOMParser().parseFromString(f.texto,'text/html'),head=[],css=[],js=[];
  [].forEach.call(d.querySelectorAll('style'),function(s){css.push(s.textContent);s.remove()});
  [].forEach.call(d.querySelectorAll('link[rel=stylesheet]'),function(l){head.push(l.outerHTML);l.remove()});
  [].forEach.call(d.querySelectorAll('script'),function(s){
    var t=(s.getAttribute('type')||'').toLowerCase();
    if(s.getAttribute('src')||t==='importmap'||t.indexOf('json')>=0)head.push(s.outerHTML);else js.push(s.textContent);
    s.remove()});
  var base=f.nome.replace(/\.html?$/i,'');
  return norm({id:'mod_'+(base.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'arquivo'),
    nome:base,desc:'Importado de '+f.nome,ativo:true,ordem:100,
    arquivo:{nome:f.nome,tamanho:f.tamanho,data:f.data},

function jsParaBloco(code){
  var arr=String(code).split('\n');
  var LIM=1200;
  if(arr.length>LIM){
    var partes=[];
    for(var i=0,k=0;i<arr.length;i+=LIM,k++){
      var ped=arr.slice(i,i+LIM).join('\n');
      partes.push(norm({
        id:'mod_js_'+Date.now().toString(36)+'_p'+k,
        nome:'JS parte '+(k+1)+'/'+Math.ceil(arr.length/LIM),
        desc:'JS colado · '+ped.length+' chars',versao:'1.0',ativo:true,ordem:100+k,
        arquivo:{nome:'colado_'+k+'.js',tamanho:ped.length,data:new Date().toISOString().slice(0,10)},
        slots:{js:ped}
      }));
    }
    return partes;
  }
  return [norm({
    id:'mod_js_'+Date.now().toString(36),
    nome:'JS '+new Date().toLocaleTimeString('pt-BR'),
    desc:'JS colado · '+code.length+' chars',versao:'1.0',ativo:true,ordem:100,
    arquivo:{nome:'colado.js',tamanho:code.length,data:new Date().toISOString().slice(0,10)},
    slots:{js:code}
  })];
}
function htmlTextoParaBloco(texto){
  return htmlParaBloco({nome:'colado.html',tamanho:texto.length,data:new Date().toISOString().slice(0,10),texto:texto});
}
function detectarEConverter(s){
  var t=String(s||'').trim();
  if(!t) throw new Error('vazio');
  // 1. JSON puro
  if(t[0]==='['||t[0]==='{'){
    try{
      var p=JSON.parse(t);
      return (Array.isArray(p)?p:[p]).map(norm);
    }catch(e){ /* continua */ }
  }
  // 2. HTML com <script id="blocos-dados">
  var m = t.match(/<script[^>]*id=["']blocos-dados["'][^>]*>([\s\S]*?)<\/script>/i);
  if(m){
    var raw = m[1].trim();
    try{
      var c;
      if(raw.indexOf('%5B')===0 || raw.indexOf('%7B')===0) c = JSON.parse(decodeURIComponent(raw));
      else c = JSON.parse(raw);
      return (Array.isArray(c)?c:[c]).map(norm);
    }catch(e){ throw new Error('JSON dentro do HTML corrompido'); }
  }
  // 3. HTML normal (vira bloco único)
  if(/<\s*(!doctype|html|head|body|div|span|script|style)/i.test(t)) return [htmlTextoParaBloco(t)];
  // 4. JS puro
  return jsParaBloco(t);
}

      snapshot('antes de aplicar '+mu.length+' módulo(s)').then(function(){
        B=L;ordena();mudou();render();rodar();
        UP.hist={id:Date.now(),quando:new Date().toISOString(),origem:UP.orig,mudancas:mu.map(function(i){return{id:i.id,acao:i.acao,de:i.de,para:i.para,hash:i.hash,antes:i.antes}}),teste:tstTxt(UP.teste),resultado:'aplicado'};
        return dbPut('hist',UP.hist)}).then(function(){UP.pkg=null;UP.rep=null;draw('✅ Atualizado: '+mu.length+' módulo(s), sem duplicar nenhum.\n\n'+mu.map(function(i){return'• '+i.id+'  '+(i.acao==='novo'?'novo v'+i.para:'v'+i.de+' → v'+i.para)}).join('\n')+'\n\nA tela já está rodando o sistema novo.\nGostou? Toque em 💾 Salvar HTML para gravar o arquivo inteiro.\nNão gostou? ↩️ Voltar.')}).catch(function(x){msg('Falhou ao aplicar: '+x.message,true)});
    }
    else if(a==='save')salvar();
    else if(a==='back')dbAll('snap').then(function(l){
      if(!l.length)return msg('Ainda não há backup.',true);var s=l[0];
      if(!confirm('Voltar ao backup de '+fd(s.quando)+' ('+s.n+' módulos)?\n'+s.motivo))return;
      return snapshot('antes de voltar').then(function(){B=JSON.parse(s.dados).map(norm);ordena();mudou();render();rodar();
        return dbPut('hist',{id:Date.now(),quando:new Date().toISOString(),origem:'backup '+fd(s.quando),mudancas:[],teste:'—',resultado:'voltou versão'})}).then(function(){draw('↩️ Voltei ao backup de '+fd(s.quando)+' · '+B.length+' módulos.\nPara fixar, toque em 💾 Salvar HTML.')})
    }).catch(function(x){msg('Erro: '+x.message,true)});
    else if(a==='hist')dbAll('hist').then(function(l){draw(l.length?'📜 HISTÓRICO\n\n'+l.slice(0,25).map(function(h){return fd(h.quando)+' · '+h.resultado+' · '+h.origem+'\n   '+(h.mudancas.map(function(m){return m.id+' '+(m.de?m.de+'→':'')+m.para}).join(', ')||'—')+'\n   teste: '+h.teste}).join('\n\n'):'Sem histórico ainda.')});
    else if(a==='rel'){var h=UP.hist;if(!h)return dbAll('hist').then(function(l){if(!l.length)return msg('Sem relatório ainda.',true);baixar(relHTML(l[0]),'relatorio_atualizacao.html','text/html')});baixar(relHTML(h),'relatorio_atualizacao.html','text/html')}
  };
}
function entrar(arr,origem){
  if(!arr.some(function(b){return B.some(function(x){return x.id===b.id})})){adicionar(arr);msg(arr.length+' bloco(s) novo(s) adicionado(s).');return}
  msg('Já existem módulos com esses ids — abrindo Atualizar (não duplico mais).');abrirAtualizador(arr,origem);
}

/* ============ BOTÕES ============ */
$('gear').onclick=function(){render();$('panel').classList.add('on')};
$('bX').onclick=fechar;
$('panel').onclick=function(e){if(e.target===$('panel'))fechar()};
$('bSave').onclick=salvar;

$('bExp').onclick=function(){
  var dados=JSON.stringify(B,null,2);
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([dados],{type:'application/json'}));
  a.download='blocos_'+new Date().toISOString().slice(0,16).replace(/\D/g,'')+'.json';
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  msg('📤 JSON exportado: '+kb(dados.length)+' · '+B.length+' bloco(s).');
};

$('bImp').onclick=function(){
  pegar(false,function(fs){
    var f=fs[0];if(!f)return;
    try{
      var arr=lerArquivo(f);
      entrar(arr,f.nome);
    }catch(e){ msg('Erro ao importar: '+e.message,true); }
  });
};

$('bRe').onclick=function(){rodar();msg('Recarregado.')};
$('bUpd').onclick=function(){abrirAtualizador(null,'')};

$('bPaste').onclick=function(){
  modal('📋 Colar · JSON / HTML / JS','',{
    salvar:function(t){
      if(!t.trim())throw new Error('vazio');
      var blocos=detectarEConverter(t);
      entrar(blocos,'colado');
    }
  });
};

$('bAdd').onclick=function(){
  var n=prompt('Nome:');if(!n)return;
  adicionar([norm({id:'mod_'+(n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'novo'),nome:n,ordem:100})]);
};

$('bFile').onclick=function(){
  pegar(true,function(fs){
    var tot=[];
    fs.forEach(function(f){
      try{ tot=tot.concat(lerArquivo(f)); }
      catch(e){ msg('"'+f.nome+'": '+e.message,true); }
    });
    if(tot.length) entrar(tot,'arquivos');
  });
};

$('lista').onclick=function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  agir(el.getAttribute('data-a'),parseInt(el.getAttribute('data-i'),10));
};

/* ============ INICIALIZA ============ */
try{
  var raw = $('blocos-dados').textContent.trim();
  var c;
  if(raw.indexOf('%5B')===0 || raw.indexOf('%7B')===0){
    c = JSON.parse(decodeURIComponent(raw));
  } else {
    c = JSON.parse(raw);
  }
  B = (Array.isArray(c)?c:[]).map(norm);
}catch(e){
  B=[];
  msg('Dados do arquivo ilegíveis: '+e.message+'\n\nVocê pode importar JSON pelo botão 📥.',true);
}
ordena();rodar();marca();
console.log('[Compilador] pronto · '+B.length+' bloco(s)');
})();
</script></body></html>
